[workspace]
members = [
    "crates/signal-bot",
    "crates/signal-bot-core",
    "crates/signal-bot-rpc",
    "crates/signal-bot-plugins",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/user/bots-signal"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
futures = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
